name: CI

on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

env:
  PROJECT_TYPE: KEXT

jobs:
  build:
    name: Build
    runs-on: macos-15
    env:
      JOB_TYPE: BUILD
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/checkout@v6
        with:
          repository: acidanthera/MacKernelSDK
          path: MacKernelSDK
      - name: CI Bootstrap
        run: |
          src=$(/usr/bin/curl -Lfs https://raw.githubusercontent.com/acidanthera/ocbuild/master/ci-bootstrap.sh) && eval "$src" || exit 1
      - name: Lilu Bootstrap
        run: |
          src=$(/usr/bin/curl -Lfs https://raw.githubusercontent.com/acidanthera/Lilu/master/Lilu/Scripts/bootstrap.sh) && eval "$src" || exit 1

      - run: xcodebuild -jobs 1 -target Package -configuration Debug
      - run: xcodebuild -jobs 1 -target Package -configuration Release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: BrcmPatchRAM-build
          path: build/*/*/*.zip

      - name: Create GitHub Release with build ZIPs
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES_FILE="Docs/releases/${TAG}.md"

          RELEASE_TITLE="$(git for-each-ref "refs/tags/${TAG}" --format='%(contents:subject)')"

          if [ -z "$RELEASE_TITLE" ]; then
            RELEASE_TITLE="$TAG"
          fi

          echo "Creating release:"
          echo "Tag: $TAG"
          echo "Title: $RELEASE_TITLE"
          echo "Notes file: $NOTES_FILE"

          find build -type f -name "*.zip" -print

          if [ -f "$NOTES_FILE" ]; then
            gh release create "$TAG" \
              build/*/*/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TITLE" \
              --notes-file "$NOTES_FILE" \
              --verify-tag
          else
            gh release create "$TAG" \
              build/*/*/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TITLE" \
              --generate-notes \
              --verify-tag
          fi

  analyze-clang:
    name: Analyze Clang
    runs-on: macos-15
    env:
      JOB_TYPE: ANALYZE

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/checkout@v6
        with:
          repository: acidanthera/MacKernelSDK
          path: MacKernelSDK

      - name: CI Bootstrap
        run: |
          src=$(/usr/bin/curl -Lfs https://raw.githubusercontent.com/acidanthera/ocbuild/master/ci-bootstrap.sh) && eval "$src" || exit 1

      - name: Lilu Bootstrap
        run: |
          src=$(/usr/bin/curl -Lfs https://raw.githubusercontent.com/acidanthera/Lilu/master/Lilu/Scripts/bootstrap.sh) && eval "$src" || exit 1

      - name: Analyze Debug
        run: |
          xcodebuild analyze -quiet \
            -scheme Package \
            -target Package \
            -configuration Debug \
            CLANG_ANALYZER_OUTPUT=plist-html \
            CLANG_ANALYZER_OUTPUT_DIR="$(pwd)/clang-analyze-debug"

      - name: Upload Debug analyzer reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clang-analyze-debug
          path: clang-analyze-debug/**/*.html
          if-no-files-found: ignore

      - name: Fail if Debug analyzer found issues
        run: |
          [ "$(find clang-analyze-debug -name "*.html" 2>/dev/null)" = "" ]

      - name: Clean
        run: xcodebuild clean -quiet -scheme Package

      - name: Analyze Release
        run: |
          xcodebuild analyze -quiet \
            -scheme Package \
            -target Package \
            -configuration Release \
            CLANG_ANALYZER_OUTPUT=plist-html \
            CLANG_ANALYZER_OUTPUT_DIR="$(pwd)/clang-analyze-release"

      - name: Upload Release analyzer reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clang-analyze-release
          path: clang-analyze-release/**/*.html
          if-no-files-found: ignore

      - name: Fail if Release analyzer found issues
        run: |
          [ "$(find clang-analyze-release -name "*.html" 2>/dev/null)" = "" ]
